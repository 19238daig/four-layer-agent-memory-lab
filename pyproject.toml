[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-lab-demo"
version = "0.1.0"
description = "Observable four-layer agent memory lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "openai>=1.70,<3", "deepagents>=0.4,<1", "langchain-openai>=0.3,<2", "langgraph-checkpoint>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
memory-demo = "memory_demo.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
